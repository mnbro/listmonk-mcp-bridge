name: Container

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv for release PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.9.30"
          enable-cache: true
          prune-cache: true

      - name: Prepare lockfile for release PR
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--')
        run: uv lock --upgrade-package listmonk-mcp-bridge

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mnbro/listmonk-mcp-bridge
          tags: |
            type=ref,event=branch
            type=ref,event=tag,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
            type=raw,value=rebuild-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and optionally publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          no-cache-filters: base
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
