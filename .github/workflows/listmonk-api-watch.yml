name: Listmonk API Watch

on:
  schedule:
    - cron: "37 5 * * 2,5"
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Listmonk release tag, or latest
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: listmonk-api-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Require update token
        env:
          UPDATE_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "GH_TOKEN_FOR_UPDATES is required so bot PRs trigger normal CI."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Scan latest stable Listmonk API contract
        id: scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag || 'latest' }}
          REPORT_PATH: ${{ runner.temp }}/listmonk-api-report.md
        run: >-
          python scripts/listmonk_api_compat.py scan
          --tag "$REQUESTED_TAG"
          --write
          --report "$REPORT_PATH"
          --github-output "$GITHUB_OUTPUT"

      - name: Detect generated changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish compatibility update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_RELEASE: ${{ steps.scan.outputs.release }}
          UPSTREAM_COMMIT: ${{ steps.scan.outputs.commit }}
          CONTRACT_ID: ${{ steps.scan.outputs.contract_id }}
          NEEDS_ATTENTION: ${{ steps.scan.outputs.needs_attention }}
          REVIEW_REQUIRED: ${{ steps.scan.outputs.review_required }}
          MISSING_BRIDGE_ROUTES: ${{ steps.scan.outputs.missing_bridge_routes }}
          REPORT_PATH: ${{ runner.temp }}/listmonk-api-report.md
          ASSIGN_COPILOT: ${{ vars.LISTMONK_API_ASSIGN_COPILOT || 'false' }}
        run: |
          set -euo pipefail
          suffix="${UPSTREAM_RELEASE#v}"
          branch="automation/listmonk-api-${suffix//./-}"
          title="chore: align with Listmonk API ${UPSTREAM_RELEASE}"
          issue_number=""

          gh label create listmonk-api \
            --repo "$REPOSITORY" \
            --description "Listmonk upstream API compatibility" \
            --color "1D76DB" \
            --force

          if [ "$NEEDS_ATTENTION" = "true" ]; then
            issue_title="Review Listmonk API ${UPSTREAM_RELEASE} compatibility"
            issue_number="$(
              gh issue list \
                --repo "$REPOSITORY" \
                --state all \
                --label listmonk-api \
                --limit 100 \
                --json number,title \
                --jq ".[] | select(.title == \"$issue_title\") | .number" \
                | head -n 1
            )"
            cp "$REPORT_PATH" "${RUNNER_TEMP}/listmonk-api-issue.md"
            printf "\nThe automation branch is \`%s\`. Review-required routes: %s. Broken bridge routes: %s.\n" \
              "$branch" "$REVIEW_REQUIRED" "$MISSING_BRIDGE_ROUTES" \
              >> "${RUNNER_TEMP}/listmonk-api-issue.md"
            if [ -z "$issue_number" ]; then
              issue_url="$(
                gh issue create \
                  --repo "$REPOSITORY" \
                  --title "$issue_title" \
                  --label listmonk-api \
                  --body-file "${RUNNER_TEMP}/listmonk-api-issue.md"
              )"
              issue_number="${issue_url##*/}"
            else
              gh issue edit "$issue_number" \
                --repo "$REPOSITORY" \
                --body-file "${RUNNER_TEMP}/listmonk-api-issue.md"
              gh issue reopen "$issue_number" --repo "$REPOSITORY" || true
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git switch -C "$branch"
          git add \
            compatibility/listmonk-api-contract.json \
            compatibility/listmonk-api-policy.json \
            compatibility/listmonk-upstream-releases.json \
            compatibility/bridge-releases.json \
            src/listmonk_mcp/listmonk_api_contract.json \
            docs/compatibility.md
          git commit -m "$title"
          git push --force-with-lease --set-upstream origin "$branch"

          cp "$REPORT_PATH" "${RUNNER_TEMP}/listmonk-api-pr.md"
          if [ -n "$issue_number" ]; then
            printf "\nCloses #%s\n" "$issue_number" >> "${RUNNER_TEMP}/listmonk-api-pr.md"
          fi
          pr_number="$(
            gh pr list \
              --repo "$REPOSITORY" \
              --state open \
              --head "$branch" \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -z "$pr_number" ]; then
            pr_url="$(
              gh pr create \
                --repo "$REPOSITORY" \
                --base master \
                --head "$branch" \
                --draft \
                --title "$title" \
                --label listmonk-api \
                --body-file "${RUNNER_TEMP}/listmonk-api-pr.md"
            )"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "$pr_number" \
              --repo "$REPOSITORY" \
              --title "$title" \
              --body-file "${RUNNER_TEMP}/listmonk-api-pr.md" \
              --add-label listmonk-api
          fi

          if [ "$NEEDS_ATTENTION" = "true" ] && [ "$ASSIGN_COPILOT" = "true" ]; then
            # shellcheck disable=SC2016
            payload="$(
              jq -n \
                --arg repository "$REPOSITORY" \
                --arg branch "$branch" \
                --arg release "$UPSTREAM_RELEASE" \
                --arg contract "$CONTRACT_ID" \
                '{
                  assignees: ["copilot-swe-agent[bot]"],
                  agent_assignment: {
                    target_repo: $repository,
                    base_branch: $branch,
                    custom_instructions: (
                      "Resolve every review_required Listmonk API decision for " +
                      $release + " (" + $contract + "). Modify only the client, " +
                      "models, server bindings, tests, compatibility policy and API " +
                      "documentation. Preserve read-only, confirmation, risk metadata " +
                      "and audit guards. After resolving all decisions, run " +
                      "`python scripts/listmonk_api_compat.py acknowledge --write`, " +
                      "then run the full test suite."
                    )
                  }
                }'
            )"
            if ! gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${REPOSITORY}/issues/${issue_number}/assignees" \
              --input - <<< "$payload"; then
              gh issue comment "$issue_number" \
                --repo "$REPOSITORY" \
                --body "Automatic Copilot assignment failed; the contract PR remains draft and fail-closed."
            fi
          fi

          echo "Published PR #${pr_number} for ${UPSTREAM_RELEASE}@${UPSTREAM_COMMIT}."
