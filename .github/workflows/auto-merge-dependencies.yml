name: Auto-merge Dependency Updates

on:
  workflow_run:
    workflows:
      - CI
      - Container
      - Deploy Docs
    types:
      - completed

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  merge-after-ci:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: auto-merge-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      cancel-in-progress: false
    steps:
      - name: Merge successful bot dependency PRs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES || github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          pr="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json author,headRefName,headRefOid,baseRefName,isCrossRepository,isDraft,state,labels)"
          if ! jq -e --arg head "$EXPECTED_HEAD" --arg base "$DEFAULT_BRANCH" '
            .state == "OPEN" and .isDraft == false and .isCrossRepository == false
            and .baseRefName == $base and .headRefOid == $head
            and (
              (([.labels[].name] | index("security")) != null and
                ((.author.login == "dependabot[bot]" or .author.login == "app/dependabot" or .author.login == "github-actions[bot]")
                 or .headRefName == "automation/python-security"))
              or ((.headRefName | startswith("release-please--")) and
                  ([.labels[].name] | index("autorelease: pending")) != null)
            )' <<< "$pr" >/dev/null; then
            echo "Skipping ineligible or stale PR #$PR_NUMBER."
            exit 0
          fi

          # CI can finish before Container, Docs, or CodeQL. Keep every check enabled.
          gh pr checks "$PR_NUMBER" --repo "$REPO" --watch --interval 15
          checks="$(gh pr checks "$PR_NUMBER" --repo "$REPO" --json name,bucket)"
          # Docs deployment is intentionally skipped on PRs; other skipped or
          # cancelled checks must not silently count as successful validation.
          jq -e 'length > 0 and all(.[]; .bucket == "pass" or (.name == "deploy" and .bucket == "skipping"))' \
            <<< "$checks" >/dev/null
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch \
            --match-head-commit "$EXPECTED_HEAD"
